services:
  postgres:
    image: postgres:15-alpine
    container_name: cvboosta_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cvboosta_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # If .env does not provide DATABASE_URL explicitly, we can construct it 
      # or override the host to point to 'postgres' inside docker network.
      # The user's .env uses localhost string, so we force-override the URL here:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    # We no longer expose port 8000 externally since Nginx handles everything,
    # but we can optionally allow it for debug
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvboosta_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # Use /api so nginx captures all calls transparently and proxies to backend!
      NEXT_PUBLIC_API_BASE: /api
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: cvboosta_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
