map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Limit file uploads
    client_max_body_size 10M;
    client_body_timeout 30s;
    send_timeout 180s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Forward /api requests space directly to the backend
    location /api/ {
        # Strip the /api/ prefix before sending to backend if the backend isn't expecting it
        # Actually, FastAPI routes are root based (e.g. /analyze, /optimize)
        # We use rewrite to slice off the /api prefix before passing to backend!
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not append a client-supplied X-Forwarded-For value. Configure
        # nginx real_ip with exact edge CIDRs if this service sits behind a CDN.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Never trust a client-supplied forwarded scheme. If TLS terminates at
        # an edge, configure that trusted edge to enforce HTTPS externally.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        # AI generation can legitimately take longer than nginx's 60s default.
        # Keep the timeout finite so stalled upstreams still recover.
        proxy_read_timeout 180s;
        proxy_cache_bypass $http_upgrade;
    }

    # Everything else belongs to the Next.js Frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
